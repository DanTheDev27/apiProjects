<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokemon Api</title>
    <link rel="stylesheet" href="pokeApi.css">
</head>
<body>
    <h1 id="pageTitle">Pokemon Data</h1>
    <div id="search"><input type="text" id="pokeInput" placeholder="Search by name or id">
    <button id="searchBtn" type="submit" onclick="getData()">Search</button>
    </div>
    <div id="container">
        <div id="pokeData">
            <h2 id="pokeName"></h2>
            <img src="" alt="pokemon img" id="pokemonSprite" style="display:none">
            
        </div>
        
    </div>
    <!-- <hr id="hrDivider"> -->
    <div id="info">
        <div id="typeInfo" style="display:none">
            <h2 id="typeDisplay" style="display:none">Type:</h2>
            <div id="type">
                <h2 id="type" style="display:none;">Type</h2>
                <ul id="type" style="display:none"></ul>
            </div>
        <!-- <ul id="type"></ul> -->
         <h2 id="typeWeakness" style="display:none">Weakness:</h2>
        <ul id="weakness" style=></ul>
        <h2 id="heightStat" style="display:none">Height:</h2>
        <ul id="height"></ul>
        <h2 id="weightStat" style="display:none">Weight:</h2>
        <ul id="weight"></ul>
        </div>
        <div id="stats" style="display:none">
            <ul id="stats" style="display:none">
                <h2>Stats</h2>
            </ul>
        </div>
    </div>
    <!-- <ul id="emptyList">
    </ul> -->
    <!-- <div id="movesDiv">
    <h2 id="moves" style="display:none">Moves</h2>
    <ul id="emptyList">
    </ul>
    </div> -->
    <script src="pokeApi.js"></script>
</body>
</html>
